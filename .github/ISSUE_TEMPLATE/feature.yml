name: Feature request
description: Propose a focused product improvement.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What should a planner be able to accomplish?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe success without prescribing implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
